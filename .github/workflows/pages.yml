name: Deploy Dashboard to GitHub Pages

# The dashboard reads data.csv, so it is rebuilt whenever the data changes.
# Commits pushed by the tracker workflow use GITHUB_TOKEN and so do not start
# `push` workflows; `workflow_run` picks those up instead.
on:
  workflow_run:
    workflows: ['Track AWS Emulator Issues']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data.csv'
      - 'agent_queue.csv'
      - 'status.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

jobs:
  get-playwright-version:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Playwright version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test-and-build:
    needs: get-playwright-version
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble
    env:
      # Firefox will not start unless $HOME belongs to the user running it.
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_run, build the commit that carries the fresh data.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npx playwright test

      # GitHub Pages serves a project site from /<repository>/.
      - name: Build
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      # Pages serves 404.html for unknown paths, so deep links such as
      # /<repository>/methodology reach the client-side router.
      - name: Prepare 404 page for the router
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
