name: Track AWS Emulator Issues

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:      # Allows manual triggering from the Actions tab

permissions:
  contents: write         # Required to push the updated chart and CSV back to the repo

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch issue counts and build chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python track_issues.py

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv issues_chart.png README.md
          git diff --staged --quiet || git commit -m "chore: update issue metrics ($(date -u +'%Y-%m-%d'))"
          git push
