name: Track AWS Emulator Issues

on:
  schedule:
    # The single source of truth for how often the data updates. Change this
    # line only: track_issues.py reads it and passes it on to status.json,
    # the README and the dashboard. Times are UTC; a few minutes past the
    # hour avoids GitHub's busiest moment for scheduled runs.
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Note for the commit message (e.g., manual refresh after agent run)'
        required: false
        default: 'manual trigger'
        type: string
      backfill_days:
        description: 'Backfill past N days of history (leave 0 for current snapshot only)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest

      - name: Fetch issue counts and build charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python track_issues.py

      - name: Commit and push changes
        env:
          TRIGGER_REASON: ${{ github.event.inputs.reason || 'scheduled check' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv agent_queue.csv status.json issues_chart.png doomsday_clock.png README.md
          git diff --staged --quiet || git commit -m "chore: update issue metrics & doomsday clock ($(date -u +'%Y-%m-%d')) - ${TRIGGER_REASON}"
          git push
